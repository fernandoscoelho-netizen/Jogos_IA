<title>Estrelas da Europa 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: ecrã inteiro — tabuleiro 3D numa esplanada europeia; interface em vidro azul UE com filetes dourados */
:root{
  --eu:#003399; --eu-d:#0A2463; --navy:#0B1B3F; --gold:#FFCC00; --gold-d:#C9A227;
  --paper:#FBF7EE; --ink:#0B1B3F; --ink-2:#4A5677; --glass:rgba(8,22,58,.84); --glass-2:rgba(8,22,58,.66);
  --line:rgba(255,204,0,.5); --soft:rgba(255,255,255,.16); --ok:#1E8E4A; --bad:#C8352E; --dim:rgba(5,12,32,.38);
  --f-d:'Fraunces',Georgia,'Times New Roman',serif;
  --f-b:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--navy);color:#fff;font-family:var(--f-b);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.ui{position:absolute;pointer-events:none;z-index:5}
.ui>*{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

#hud{top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:700;font-size:21px;line-height:1;color:var(--gold);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 16px 7px 8px;box-shadow:0 10px 30px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#clock{font-family:var(--f-d);font-weight:700;font-size:20px;color:#fff;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-variant-numeric:tabular-nums}
#clock.low{border-color:var(--bad);color:#FFB4AE}
.spacer{flex:1}
.hudbtns{display:flex;gap:8px}
.hb{width:46px;height:46px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);border-radius:50%;color:var(--gold);font-family:var(--f-d);font-weight:700;font-size:15px;letter-spacing:.04em;padding:0;box-shadow:0 8px 22px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .1s,background .15s}
.hb:hover{background:rgba(0,51,153,.9)}
.hb:active{transform:scale(.94)}
.hb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hb[aria-pressed="false"]{color:rgba(255,255,255,.5);border-color:var(--soft)}

#players{top:80px;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.pchip{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--soft);border-radius:14px;padding:7px 14px 7px 9px;min-width:0;box-shadow:0 8px 22px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .25s,border-color .25s}
.pchip.cur{border-color:var(--gold);transform:translateX(6px);box-shadow:0 0 0 1px var(--gold),0 10px 26px rgba(0,0,0,.3)}
.pchip .pn{font-family:var(--f-d);font-weight:700;font-size:17px;line-height:1.15;max-width:9.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .ps{font-size:13px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums}
.pchip .sc{font-family:var(--f-d);font-weight:700;font-size:23px;color:var(--gold);margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums}

#turnbar{left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:9px 9px 9px 16px;box-shadow:0 16px 40px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);max-width:calc(100% - 32px)}
.tb-who{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-weight:700;font-size:19px;line-height:1.1;min-width:0}
.tb-who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tbDice{font-family:var(--f-d);font-weight:700;font-size:24px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--paper);color:var(--eu);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
#hint{left:max(16px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));font-size:13px;color:rgba(255,255,255,.85);background:var(--glass-2);padding:5px 12px;border-radius:999px;pointer-events:none}
#pickmsg{left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 86px);transform:translateX(-50%);background:var(--gold);color:var(--navy);border-radius:14px;padding:11px 18px;font-family:var(--f-d);font-weight:700;font-size:18px;box-shadow:0 12px 30px rgba(0,0,0,.3);text-align:center;max-width:calc(100% - 32px);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.03)}}
#toasts{top:80px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(540px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:999px;padding:9px 18px;font-weight:700;font-size:16px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:tin .3s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:6px 22px;background:var(--gold);color:var(--navy);border:0;border-radius:12px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.25);font-family:var(--f-d);font-weight:700;font-size:19px;line-height:1;transition:transform .1s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:56px;font-size:22px;padding:6px 28px}
.btn.blue{background:var(--eu);color:#fff;box-shadow:inset 0 0 0 1px var(--line),0 8px 20px rgba(0,0,0,.25)}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.btn svg{width:26px;height:26px}

.layer{position:absolute;inset:0;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:var(--dim);z-index:20}
#qmodal{z-index:15}
.panel{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:26px;display:flex;flex-direction:column;gap:16px;color:#fff}
.panel h1{font-family:var(--f-d);font-weight:700;font-size:clamp(38px,8vw,58px);line-height:.98;margin:0;text-align:center;text-wrap:balance;color:var(--gold);letter-spacing:-.01em}
.panel h2{font-family:var(--f-d);font-weight:700;font-size:30px;line-height:1.08;margin:0;text-wrap:balance}
.lead{margin:0;text-align:center;font-size:18px;color:rgba(255,255,255,.82);text-wrap:balance}
.logo{display:grid;place-items:center}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.row.end{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:8px}
.lbl{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:46px;min-width:46px;padding:4px 16px;border:0;border-radius:12px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);color:#fff;font-family:var(--f-d);font-weight:700;font-size:17px}
.seg button.on{background:var(--gold);color:var(--navy);box-shadow:none}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:10px;align-items:center}
.prow .chip{width:52px;height:52px;flex:none;display:grid;place-items:center;border:0;border-radius:12px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);padding:0}
.prow input{flex:1;min-width:0;height:52px;border:0;border-radius:12px;padding:0 14px;font:700 19px var(--f-b);color:var(--navy);background:var(--paper)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:6px 8px 6px 16px;border:0;border-radius:12px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);font-weight:700;font-size:17px;text-align:left;color:#fff}
.tog .sw{width:54px;height:30px;border-radius:15px;background:rgba(255,255,255,.25);position:relative;flex:none;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-checked="true"] .sw{background:var(--gold)}
.tog[aria-checked="true"] .sw::after{left:27px;background:var(--navy)}
.volrow{display:flex;align-items:center;gap:12px;font-weight:700}
.volrow input{flex:1;accent-color:var(--gold);height:32px}
.qsec{border-top:1px solid var(--soft);padding-top:14px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#listview{top:76px;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 84px);width:min(380px,calc(100% - 32px));z-index:12}
.lvbox{height:100%;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);overflow:hidden}
.lvhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 4px 16px}
.lvhead h2{margin:0;font-family:var(--f-d);font-weight:700;font-size:19px;color:var(--gold)}
.lvhead .hb{width:40px;height:40px;box-shadow:none}
.lvsum{margin:0;padding:0 16px 8px;font-size:13px;color:rgba(255,255,255,.75)}
#lvList{list-style:none;margin:0;padding:0 8px 10px;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.lvrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.05)}
.lvrow.here{box-shadow:inset 0 0 0 1px var(--gold)}
.lvrow.off{opacity:.45}
.lvn{flex:none;width:24px;text-align:right;font-size:13px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.lvdot{flex:none;width:12px;height:12px;border-radius:3px}
.lvt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.lvt b{font-size:15px}
.lvt span{font-size:13px;color:rgba(255,255,255,.75)}
.lvpick{min-height:38px;padding:4px 12px;font-size:15px;border-radius:10px}
.goal{margin:0;font-size:14px;line-height:1.45;color:rgba(255,255,255,.78)}
.pchip .sc small{font-size:.58em;opacity:.75;margin-left:2px}
.regnote{margin:0;font-size:13px;color:rgba(255,255,255,.7)}
.qstat{margin:0;font-weight:700;font-size:17px}
.qmsg{margin:0;padding:8px 12px;border-radius:10px;background:rgba(30,142,74,.25);box-shadow:inset 0 0 0 1px rgba(120,220,150,.5);font-size:15px}
.qmsg.bad{background:rgba(200,53,46,.25);box-shadow:inset 0 0 0 1px rgba(255,140,130,.6)}
.qhelp{margin:0;font-size:14px;line-height:1.45;color:rgba(255,255,255,.72);max-width:65ch}
.row.start{justify-content:flex-start}
#tplbox{width:100%;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border-radius:10px;border:0;padding:8px;background:var(--paper);color:var(--navy);resize:vertical}
.rules{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;line-height:1.5;max-width:65ch;color:rgba(255,255,255,.9)}
.rules b{color:var(--gold)}
.regs{display:flex;flex-wrap:wrap;gap:6px}
.regs span{color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 14px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font-family:var(--f-d);font-weight:700;font-size:19px}
.rank li.w{box-shadow:inset 0 0 0 1.5px var(--gold);background:rgba(255,204,0,.12)}
.rank .sc{margin-left:auto;color:var(--gold);font-size:22px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.16);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:700;font-size:14px;color:rgba(255,255,255,.8)}
.th-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.wintitle{text-align:center;color:var(--gold)}

.qcard{width:min(660px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 1px rgba(201,162,39,.6);animation:qin .4s cubic-bezier(.2,1.25,.4,1)}
@keyframes qin{from{transform:perspective(900px) rotateX(18deg) scale(.9);opacity:0}}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px 11px;color:#fff;border-radius:22px 22px 0 0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.qtheme{font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase}
.qwhere{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-weight:700;font-size:19px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px 4px 6px;min-width:0}
.qwhere img{width:36px;height:24px;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.qtimer{height:6px;background:#E8E0CE}
.qtimer i{display:block;height:100%;background:var(--ok);width:100%}
.qbody{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px}
.qwho{margin:0;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2)}
#qtext{font-family:var(--f-d);font-weight:700;font-size:clamp(21px,3.6vw,26px);line-height:1.28;margin:0;text-wrap:balance;color:var(--navy)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qopt{display:flex;align-items:center;gap:12px;min-height:60px;text-align:left;padding:8px 14px 8px 10px;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px #DDD3BF,0 3px 0 #E4DAC6;font-size:18px;font-weight:700;line-height:1.25;color:var(--ink);transition:transform .08s,box-shadow .15s}
.qopt:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--eu),0 3px 0 #E4DAC6}
.qopt:active:not(:disabled){transform:translateY(2px)}
.qopt .k{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--eu);color:var(--gold);font-family:var(--f-d);font-weight:700;font-size:17px}
.qopt:disabled{cursor:default}
.qopt.ok{background:#DFF3E5;box-shadow:inset 0 0 0 2px #1E8E4A;color:#135C30}
.qopt.ok .k{background:#1E8E4A;color:#fff}
.qopt.bad{background:#FBE1DE;box-shadow:inset 0 0 0 2px #C8352E;color:#8C211B}
.qopt.bad .k{background:#C8352E;color:#fff}
.qopt.dim{opacity:.5}
.qbuzz{display:flex;flex-wrap:wrap;gap:10px}
.qbuzz button{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 18px;border:0;border-radius:14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.15);color:#fff;font-family:var(--f-d);font-weight:700;font-size:19px}
.qfeed{border-radius:14px;padding:12px 16px;background:#fff;box-shadow:inset 0 0 0 1.5px #DDD3BF;display:flex;flex-direction:column;gap:4px}
.qfeed strong{font-family:var(--f-d);font-weight:700;font-size:22px}
.qfeed.ok strong{color:#135C30}.qfeed.bad strong{color:#8C211B}
.qfeed p{margin:0;font-size:17px;line-height:1.5}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.qcard .btn.ghost{color:var(--eu);box-shadow:inset 0 0 0 1.5px var(--eu)}
#loading{z-index:30;font-family:var(--f-d);font-weight:700;font-size:26px;color:var(--gold);background:var(--navy)}

@media (max-width:700px){
  .brand span{display:none}.brand{padding:7px}
  #players{top:72px;right:max(16px,env(safe-area-inset-right,0px));flex-direction:row;flex-wrap:wrap;gap:6px}
  .pchip{padding:5px 10px 5px 6px;gap:6px;border-radius:12px}
  .pchip.cur{transform:translateY(2px)}
  .pchip .pn{font-size:15px;max-width:6em}
  .pchip .ps{display:none}
  .pchip .sc{font-size:18px}
  #toasts{top:auto;bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 86px)}
  .tb-who{font-size:16px}
  .btn.big{font-size:19px;min-height:52px;padding:6px 16px}
  #hint{display:none}
  .qopts{grid-template-columns:1fr}
  .panel{padding:18px}
}
@media (max-width:380px){.hb{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){.qcard,.toast{animation:none}#pickmsg{animation:none}}
</style>

function gridRC(i){if(i<10)return[9,9-i];if(i<19)return[18-i,0];if(i<28)return[0,i-18];return[i-27,9]}

function local(ti,lx,lz,y){const o=tileObjs[ti],c=Math.cos(o.th),s=Math.sin(o.th);return V(o.x+lx*c+lz*s,y,o.z-lx*s+lz*c)}

async function takeTurn(){

    G.follow=p.av;cineChase(p.av);

async function resolveLanding(pi,ck){const p=G.players[pi],b=BOARD[p.pos];

/* ---------------- Ciclo principal ---------------- */
const lerpAng=(a,b,k)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*Math.min(1,k)};
let clockTick=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta()),T=clock.elapsedTime;
  updTweens(dt);
  cineUpdate(dt);
  controls.update();
  G.players.forEach(p=>{const a=p.av;if(!a||a.userData.walk)return;const tg=Math.atan2(camera.position.x-a.position.x,camera.position.z-a.position.z);a.rotation.y=lerpAng(a.rotation.y,tg,dt*4);a.userData.body.position.y=.95+Math.sin(T*3+a.userData.ph)*.05;a.userData.body.rotation.z=Math.sin(T*2+a.userData.ph)*.06});
  G.tiles.forEach(tl=>{tl.meshes.forEach(m=>{if(m)m.rotation.y+=dt*1.6});if(tl.deco)tl.deco.userData.flag.rotation.y=Math.sin(T*3)*.35});
  animWorld(dt,T);
  updFx(dt);
  if(picking){const k=.25+.25*Math.sin(T*6);tileObjs.forEach((o,i)=>{o.top.material.emissiveIntensity=picking.ok[i]?k:0})}
  if(winGroup)winGroup.rotation.y+=dt*.6;
  if(Q.active&&Q.timing&&$('#overlay').hidden){Q.left-=dt;const p=Math.max(0,Q.left/20);const bar=$('#qbar');bar.style.width=(p*100)+'%';bar.style.background=p<.3?'#E04848':p<.6?'#FFCC00':'#22A045';if(Q.left<=0)qTimeout()}
  if(G.on&&isTimed(G.mode)&&(clockTick+=dt)>.25){clockTick=0;const rem=Math.max(0,G.endAt-Date.now()),m=Math.floor(rem/60000),s=Math.floor(rem/1000)%60;const ce=$('#clock');ce.textContent=`${m}:${String(s).padStart(2,'0')}`;ce.classList.toggle('low',rem<60000);if(rem===0&&!G.timeUpShown){G.timeUpShown=true;toast(t('gameTimeUp'))}}
  renderer.render(scene,camera)}
function assemble(){tileObjs.forEach((o,i)=>{o.g.position.y=7;o.g.scale.setScalar(.6);(async()=>{await wait(i*.035);await tween(.55,e=>{o.g.position.y=7*(1-e);o.g.scale.setScalar(.6+.4*e)},E.back)})()})}

  renderHUD();
  if(!window.THREE||!THREE.OrbitControls){$('#loading').textContent=t('nowebgl');return}
  try{init3D()}catch(e){console.error(e);$('#loading').textContent=t('nowebgl');return}
  try{await Promise.race([Promise.all([document.fonts.load('700 40px "Fraunces"'),document.fonts.load('600 40px "Fraunces"'),document.fonts.load('700 20px "Atkinson Hyperlegible"')]),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  loadBank();redrawAll();loop();assemble();
  $('#loading').hidden=true;controls.autoRotate=true;showScreen('start');
}
boot();
})();
</script>
